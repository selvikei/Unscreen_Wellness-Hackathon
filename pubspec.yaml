name: unscreen
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.11.4


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2   # simple state management for simple app
  shared_preferences: ^2.2.3  # local data storage
  intl: ^0.19.0               # formatting date and time for history
  installed_apps: ^1.5.0      # to get the list of installed apps

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true